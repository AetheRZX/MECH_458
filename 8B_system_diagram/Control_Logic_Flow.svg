gthAdjust="spacingAndGlyphs" textLength="5" x="5" y="376.1875">}</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="393.7969"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="32" x="5" y="411.4063">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="194" x="5" y="429.0156">if (Safety Check?) then (NO)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="177" x="21" y="446.625">:HALT / ERROR; &lt;&lt;Error&gt;&gt;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="31" x="21" y="464.2344">stop</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="72" x="5" y="481.8438">else (YES)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="105" x="21" y="499.4531">:System Ready;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="36" x="5" y="517.0625">endif</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="534.6719"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="133" x="5" y="552.2813">:Wait for HMI Input;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="123" x="5" y="569.8906">:Calculate Profile;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="587.5"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="229" x="5" y="605.1094">:Send VFD Command; &lt;&lt;Action&gt;&gt;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="183" x="5" y="622.7188">:Motor Motion; &lt;&lt;Action&gt;&gt;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="640.3281"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="222" x="5" y="657.9375">while (Target Reached?) is (NO)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="115" x="21" y="675.5469">:Read Encoders;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="123" x="21" y="693.1563">:Calculate Profile;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="106" x="5" y="710.7656">endwhile (YES)</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="122" x="9" y="728.375">Cannot find while</text><!--
@startuml Control_Logic_Flow

skinparam linetype ortho

skinparam activity {
    BackgroundColor #e1f5fe
    BorderColor #01579b
    FontColor #01579b
}
skinparam activity<<Action>> {
    BackgroundColor #e8f5e9
    BorderColor #2e7d32
    FontColor #1b5e20
}
skinparam activity<<Error>> {
    BackgroundColor #ffebee
    BorderColor #b71c1c
    FontColor #b71c1c
}

start
if (Safety Check?) then (NO)
    :HALT / ERROR; <<Error>>
    stop
else (YES)
    :System Ready;
endif

:Wait for HMI Input;
:Calculate Profile;

:Send VFD Command; <<Action>>
:Motor Motion; <<Action>>

while (Target Reached?) is (NO)
    :Read Encoders;
    :Calculate Profile;
endwhile (YES)

:Engage Brakes; <<Action>>
stop

@enduml

